name: Publisher validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publisher-validation.yml'
      - 'admin/**'
      - 'worker/**'
      - 'schema/**'
      - 'scripts/**'
      - 'start-website.ps1'
      - 'package.json'
      - 'package-lock.json'

# These jobs never deploy, use production secrets, or modify repository refs.
permissions:
  contents: read

concurrency:
  group: publisher-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.suite }} (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [application, publisher, site]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            worker/package-lock.json
            schema/package-lock.json
      - name: Install locked dependencies
        id: install
        run: |
          npm ci
          npm ci --prefix schema
          npm ci --prefix worker
          npm ci --prefix admin
      - name: Install the test browser
        if: matrix.suite != 'application'
        run: npx --no-install playwright install --with-deps chromium
      - name: Publisher regressions
        if: matrix.suite == 'publisher'
        timeout-minutes: 8
        run: npm --prefix worker run test:publisher
      - name: Worker typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.suite == 'application' }}
        run: npm --prefix worker run typecheck
      - name: Worker tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.suite == 'application' }}
        timeout-minutes: 8
        run: npm --prefix worker test
      - name: Admin typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.suite == 'application' }}
        run: npm --prefix admin run typecheck
      - name: Admin tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.suite == 'application' }}
        timeout-minutes: 5
        run: npm --prefix admin test
      - name: Admin build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.suite == 'application' }}
        run: npm --prefix admin run build
      - name: Site typecheck
        if: matrix.suite == 'site'
        run: npm run typecheck
      - name: Site verification
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.suite == 'site' }}
        run: npm run verify
      - name: Verify the recorded gate exit code
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.suite == 'site' }}
        run: |
          node -e "const fs=require('node:fs'); const code=fs.readFileSync('.verify-exit.code','utf8').trim(); if(code!=='0') throw new Error('Website gates did not finish successfully: '+code);"

  windows-launcher:
    name: Windows PowerShell 5.1 regressions
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            worker/package-lock.json
            schema/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix schema
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix admin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launcher regression suite
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\test-start-website.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Standalone upgrade regression suite
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\test-publish-upgrade.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
