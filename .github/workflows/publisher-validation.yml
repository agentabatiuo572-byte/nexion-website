name: Publisher validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publisher-validation.yml'
      - 'admin/**'
      - 'worker/**'
      - 'schema/**'
      - 'scripts/**'
      - 'start-website.ps1'
      - 'package.json'
      - 'package-lock.json'

# No deployment, production credentials, database migration or ref mutation.
permissions:
  contents: read

concurrency:
  group: publisher-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.suite }} (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [application, publisher, site]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            worker/package-lock.json
            schema/package-lock.json
      - name: Install locked dependencies
        id: install
        run: |
          npm ci
          npm ci --prefix schema
          npm ci --prefix worker
          npm ci --prefix admin
      - name: Install the test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Create a verified private source snapshot
        id: snapshot
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          import path from 'node:path';
          import { createWorkspace } from './worker/lib/runner-core.mjs';
          const workspace = await createWorkspace(process.cwd(), path.join(process.env.RUNNER_TEMP, 'publisher-validation'));
          await appendFile(process.env.GITHUB_ENV, `VALIDATION_ROOT=${workspace.site}\n`);
          console.log(`Verified source snapshot: ${workspace.sourceSnapshot.sha256}`);
          NODE
      - name: Generate current Worker binding types
        run: npm --prefix "$VALIDATION_ROOT/worker" run types
      - name: Publisher regressions
        if: matrix.suite == 'publisher'
        timeout-minutes: 15
        run: npm --prefix "$VALIDATION_ROOT/worker" run test:publisher
      - name: Worker typecheck
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && matrix.suite == 'application' }}
        run: npm --prefix "$VALIDATION_ROOT/worker" run typecheck
      - name: Build fresh static assets in the private snapshot
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && matrix.suite == 'application' }}
        id: assets
        run: |
          cd "$VALIDATION_ROOT"
          node --import ./worker/register-ts-ext.mjs --input-type=module <<'NODE'
          import { buildSiteForGates, prepareWorkerTestAssets } from './worker/lib/runner-gates.mjs';
          const result = await buildSiteForGates(process.cwd(), { onOutput: text => process.stdout.write(text) });
          if (!result.ok) throw new Error(`${result.gate}: ${result.tail}`);
          await prepareWorkerTestAssets(process.cwd());
          NODE
      - name: Worker tests
        if: ${{ !cancelled() && steps.assets.outcome == 'success' && matrix.suite == 'application' }}
        timeout-minutes: 10
        run: npm --prefix "$VALIDATION_ROOT/worker" test
      - name: Admin typecheck
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && matrix.suite == 'application' }}
        run: npm --prefix "$VALIDATION_ROOT/admin" run typecheck
      - name: Admin tests
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && matrix.suite == 'application' }}
        timeout-minutes: 5
        run: npm --prefix "$VALIDATION_ROOT/admin" test
      - name: Admin build
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && matrix.suite == 'application' }}
        run: npm --prefix "$VALIDATION_ROOT/admin" run build
      - name: Site typecheck
        if: matrix.suite == 'site'
        run: npm --prefix "$VALIDATION_ROOT" run typecheck
      - name: Site verification
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && matrix.suite == 'site' }}
        timeout-minutes: 20
        run: npm --prefix "$VALIDATION_ROOT" run verify
      - name: Verify the recorded gate exit code
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && matrix.suite == 'site' }}
        run: |
          cd "$VALIDATION_ROOT"
          node -e "const fs=require('node:fs'); const code=fs.readFileSync('.verify-exit.code','utf8').trim(); if(code!=='0') throw new Error('Website gates did not finish successfully: '+code);"

  windows-launcher:
    name: Windows PowerShell 5.1 regressions
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            worker/package-lock.json
            schema/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix schema
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix admin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launcher regression suite
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\test-start-website.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Standalone upgrade regression suite
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\test-publish-upgrade.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
