# Official Cloudflare networks verified 2026-10-16.
geo $realip_remote_addr $uvel_cloudflare_edge {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map $uvel_cloudflare_edge $uvel_country { default XX; 1 $http_cf_ipcountry; }
limit_req_zone $binary_remote_addr zone=uvel_requests:10m rate=30r/s;
server {
    listen 80;
    server_name uvel.ai www.uvel.ai;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/uvel/acme; default_type text/plain; try_files $uri =404; }
    location / { return 308 https://uvel.ai$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.uvel.ai;
    ssl_certificate /etc/letsencrypt/live/uvel.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uvel.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 308 https://uvel.ai$request_uri;
}
server {
    listen 443 ssl;
    server_name uvel.ai;
    ssl_certificate /etc/letsencrypt/live/uvel.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uvel.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    access_log /var/log/nginx/uvel.access.log;
    error_log /var/log/nginx/uvel.error.log;
    location ~ /\. { return 404; }
    location / {
        limit_req zone=uvel_requests burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host uvel.ai;
        proxy_set_header Connection "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-IPCountry $uvel_country;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
